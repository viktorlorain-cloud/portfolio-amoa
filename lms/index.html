<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS Learning · LMS — Plateforme de gestion de formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4f46e5; --primary-dark:#3730a3; --primary-soft:#eef2ff; --primary-mid:#c7d2fe;
    --ink:#0f172a; --dark:#1e1b4b;
    --accent:#f59e0b; --accent-soft:#fef3c7;
    --green:#16a34a; --green-soft:#dcfce7;
    --red:#dc2626; --red-soft:#fee2e2;
    --blue:#0284c7; --blue-soft:#e0f2fe;
    --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc;
    --border:#e2e8f0; --border-dark:#cbd5e1;
    --muted:#64748b; --muted2:#94a3b8;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    --shadow-lg:0 10px 30px rgba(15,23,42,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-dark);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── LAYOUT ── */
  .app{display:flex;min-height:100vh}
  .sidebar{width:248px;background:var(--dark);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:100}
  .brand{padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
  .brand-logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:17px;flex-shrink:0}
  .brand-txt b{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.3px;display:block;line-height:1.1}
  .brand-txt span{color:rgba(255,255,255,.45);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
  .nav{flex:1;overflow-y:auto;padding:14px 12px}
  .nav-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:700;padding:14px 12px 6px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.62);font-size:13.5px;font-weight:500;transition:.15s;margin-bottom:2px;cursor:pointer}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,.4)}
  .nav-ico{width:18px;height:18px;flex-shrink:0;stroke-width:2}
  .nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);padding:1px 8px;border-radius:20px}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.25);color:#fff}
  .sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
  .role-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px}
  .role-box label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:700;display:block;margin-bottom:6px}
  .role-box select{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:7px;padding:7px 8px;font-size:12.5px;font-weight:600;font-family:inherit}

  .main{flex:1;margin-left:248px;min-width:0}
  .topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:-.4px}
  .topbar .crumb{font-size:11.5px;color:var(--muted);margin-top:1px}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .who{display:flex;align-items:center;gap:9px;padding:5px 7px 5px 12px;border:1px solid var(--border);border-radius:30px}
  .who .nm{font-size:12.5px;font-weight:700}.who .rl{font-size:10.5px;color:var(--muted)}
  .who .av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .view{padding:26px 28px 60px}

  /* ── COMPONENTS ── */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:.15s}
  .btn:hover{background:var(--surface2);border-color:var(--border-dark)}
  .btn svg{width:15px;height:15px;stroke-width:2.2}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:var(--surface2)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .card-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .card-h h3{font-size:14px;font-weight:700}
  .card-b{padding:20px}

  .section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .section-row h2{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .section-row p{font-size:13px;color:var(--muted);margin-top:2px}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:30px;letter-spacing:.2px}
  .pill .dot{width:6px;height:6px;border-radius:50%}
  .pill-green{background:var(--green-soft);color:#15803d}
  .pill-amber{background:var(--accent-soft);color:#b45309}
  .pill-blue{background:var(--blue-soft);color:#0369a1}
  .pill-red{background:var(--red-soft);color:#b91c1c}
  .pill-gray{background:#f1f5f9;color:#475569}
  .pill-indigo{background:var(--primary-soft);color:var(--primary-dark)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
  td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:.12s}
  tbody tr:hover{background:var(--surface2)}
  .t-name{font-weight:700}
  .t-sub{font-size:11.5px;color:var(--muted)}

  .grid{display:grid;gap:16px}
  .input,.select,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border-dark);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--ink);transition:.15s}
  .input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#334155}
  .field .hint{font-size:11px;color:var(--muted2);margin-top:4px}

  /* avatar chips */
  .chip{display:inline-flex;align-items:center;gap:8px}
  .ava{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex-shrink:0}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .kpi .ic svg{width:20px;height:20px;stroke-width:2.2}
  .kpi .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:2px;line-height:1}
  .kpi .sub{font-size:11.5px;color:var(--muted2);margin-top:6px}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .18s}
  .modal.wide{max-width:760px}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal-h{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:16px;font-weight:800}
  .modal-h p{font-size:12px;color:var(--muted);margin-top:2px}
  .modal-b{padding:24px;max-height:65vh;overflow-y:auto}
  .modal-f{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--surface2);border-radius:0 0 16px 16px}
  .x{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
  .x:hover{background:var(--red-soft);color:var(--red);border-color:var(--red-soft)}

  /* PROCESS KANBAN */
  .kanban{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
  .kcol{background:var(--surface2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:200px}
  .kcol-h{padding:12px 13px;border-bottom:1px solid var(--border);position:sticky;top:0}
  .kcol-h .n{font-size:9px;font-weight:800;color:var(--muted2);letter-spacing:.5px}
  .kcol-h .t{font-size:12.5px;font-weight:700;margin-top:2px;line-height:1.2}
  .kcol-h .c{font-size:10px;color:var(--muted);margin-top:3px}
  .kcol-b{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
  .kcard:hover{border-color:var(--primary-mid);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .kcard .kt{font-size:12.5px;font-weight:700}
  .kcard .ks{font-size:11px;color:var(--muted);margin-top:3px}
  .kcard .kfoot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}

  /* CALENDAR */
  .cal-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px}
  .cal-nav button:hover{background:var(--surface2)}
  .cal-month{font-size:17px;font-weight:800;text-transform:capitalize;min-width:180px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cal-dow{background:var(--surface2);padding:9px;text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .cal-cell{background:var(--surface);min-height:104px;padding:7px 7px 5px;position:relative;transition:.12s}
  .cal-cell:hover{background:var(--surface2)}
  .cal-cell.out{background:#fbfcfe;color:var(--muted2)}
  .cal-cell.today{background:var(--primary-soft)}
  .cal-date{font-size:12px;font-weight:700;margin-bottom:5px}
  .cal-cell.today .cal-date{color:var(--primary);width:22px;height:22px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .cal-add{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:none;align-items:center;justify-content:center;font-size:14px;line-height:1}
  .cal-cell:hover .cal-add{display:flex}
  .ev{font-size:10.5px;padding:3px 6px;border-radius:5px;margin-bottom:3px;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
  .ev .evt{font-size:9.5px;opacity:.85;font-weight:500}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty svg{width:42px;height:42px;stroke-width:1.6;color:var(--muted2);margin-bottom:12px}
  .empty p{font-size:13px}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* signature pad */
  .sigpad{border:2px dashed var(--border-dark);border-radius:10px;background:var(--surface2);touch-action:none;display:block;width:100%;cursor:crosshair}
  .sig-done{border:2px solid var(--green);border-radius:10px;background:var(--green-soft);padding:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#15803d}

  .progress{height:7px;background:var(--border);border-radius:5px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--primary);border-radius:5px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
  .tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:300;display:flex;align-items:center;gap:9px;animation:pop .2s}
  .toast svg{width:17px;height:17px;color:#4ade80}

  .stars{display:inline-flex;gap:2px}
  .star{font-size:15px;color:var(--accent)}
  .star.off{color:var(--border-dark)}

  .two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  @media(max-width:1100px){.two-col{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">AS</div>
      <div class="brand-txt"><b>AS Learning</b><span>LMS · Formation</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="role-box">
        <label>Connecté en tant que</label>
        <select id="roleSel" onchange="App.setRole(this.value)">
          <option value="admin">Administrateur (gérante)</option>
          <option value="formateur">Formateur</option>
          <option value="stagiaire">Stagiaire</option>
        </select>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">Tableau de bord</h1><div class="crumb" id="pageCrumb">Vue d'ensemble de l'activité de formation</div></div>
      <div class="topbar-right">
        <button class="btn btn-sm" onclick="App.resetDemo()" title="Réinitialiser les données de démo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>
          Démo
        </button>
        <div class="who"><div><div class="nm" id="whoName">A. Graingeot</div><div class="rl" id="whoRole">Administratrice</div></div><div class="av" id="whoAv">AG</div></div>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================
   AS LEARNING — LMS  (prototype mono-fichier, persistance localStorage)
   Couvre : centralisation des données · processus administratif 6 étapes
   (cf. cartographie) · calendrier d'assignation des interventions formateurs
   · émargement électronique · suivi de séance · programmes & auto-évaluation
   · supports · reporting QUALIOPI
   ============================================================ */

/* ---------- ICONS (inline svg) ---------- */
const I = {
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
  process:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/><path d="M10 6.5h4M17.5 10v4M10 17.5h4M6.5 10v4"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  teacher:'<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  sign:'<path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18zM2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  report:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  hours:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  trend:'<path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'
};
const svg=(p,cls)=>`<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ---------- SEED DATA ---------- */
const COLORS=['#4f46e5','#0284c7','#16a34a','#f59e0b','#db2777','#7c3aed','#0d9488','#dc2626'];
const STEPS=[
  {n:1,t:'Prise de contact & Audit',c:'Demande, audit CECR, auto-évaluation, objectifs'},
  {n:2,t:'Construction de l\'offre',c:'Formule, programme, devis, proposition'},
  {n:3,t:'Mise en place administrative',c:'Conventions, formateur, planning, convocations'},
  {n:4,t:'Déroulement de la formation',c:'Guide d\'animation, émargement, relances'},
  {n:5,t:'Clôture & Certification',c:'Certificat de réalisation, satisfaction'},
  {n:6,t:'Facturation & Archivage',c:'Factures + feuilles de présence, dépôt OPCO/CPF'}
];

function seed(){
  const formateurs=[
    {id:'f1',nom:'Sarah Mitchell',langue:'Anglais',email:'s.mitchell@aslearning.fr',tel:'06 12 34 56 78',natif:true,color:COLORS[0]},
    {id:'f2',nom:'Klaus Bauer',langue:'Allemand',email:'k.bauer@aslearning.fr',tel:'06 22 11 33 44',natif:true,color:COLORS[1]},
    {id:'f3',nom:'Elena Rossi',langue:'Italien',email:'e.rossi@aslearning.fr',tel:'06 55 66 77 88',natif:true,color:COLORS[2]},
    {id:'f4',nom:'Diego Fernández',langue:'Espagnol',email:'d.fernandez@aslearning.fr',tel:'06 99 88 77 66',natif:true,color:COLORS[3]},
    {id:'f5',nom:'James Carter',langue:'Anglais',email:'j.carter@aslearning.fr',tel:'06 44 55 66 77',natif:true,color:COLORS[4]},

/* ---------- HELPERS ---------- */
function fmtD(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`;}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function initials(s){return s.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const stag=id=>DB.data.stagiaires.find(s=>s.id===id);
const form=id=>DB.data.formateurs.find(f=>f.id===id);
const stagName=id=>{const s=stag(id);return s?s.prenom+' '+s.nom:'—';};
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DOW=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function frDate(s){const d=parseD(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,4)+'. '+d.getFullYear();}
function statutPill(st){const m={'Terminé':'green','En cours':'blue','À démarrer':'gray'};return `<span class="pill pill-${m[st]||'gray'}"><span class="dot" style="background:currentColor"></span>${st}</span>`;}

/* ---- CALENDAR ---- */
let calRef=new Date();calRef.setDate(1);
let calFilterF='';
Views.calendar=function(){
  const d=DB.data;
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1);let start=(first.getDay()+6)%7; // Monday=0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=fmtD(new Date());
  let html=`<div class="section-row"><div><h2>Calendrier des interventions</h2><p>Planification et assignation des séances aux formateurs · disponibilités en temps réel</p></div>
    <button class="btn btn-primary" onclick="Forms.seance()">${svg(I.plus)}Planifier une séance</button></div>`;
  html+=`<div class="cal-head">
    <div class="cal-nav"><button onclick="App._calMove(-1)">‹</button><button onclick="App._calToday()">•</button><button onclick="App._calMove(1)">›</button></div>
    <div class="cal-month">${MONTHS[m]} ${y}</div>
    <select class="select" style="width:auto;margin-left:auto" onchange="App._calFilter(this.value)">
      <option value="">Tous les formateurs</option>
      ${d.formateurs.map(f=>`<option value="${f.id}" ${calFilterF===f.id?'selected':''}>${esc(f.nom)} (${esc(f.langue)})</option>`).join('')}
    </select>
  </div>`;
  html+=`<div class="cal-grid">${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}`;
  let seances=d.seances; if(calFilterF)seances=seances.filter(s=>s.formateurId===calFilterF);
  // leading blanks
  for(let i=0;i<start;i++){const dd=new Date(y,m,1-(start-i));html+=`<div class="cal-cell out"><div class="cal-date">${dd.getDate()}</div></div>`;}
  for(let day=1;day<=daysInMonth;day++){
    const ds=fmtD(new Date(y,m,day));
    const evs=seances.filter(s=>s.date===ds).sort((a,b)=>a.debut.localeCompare(b.debut));
    html+=`<div class="cal-cell ${ds===today?'today':''}"><div class="cal-date">${day}</div><div class="cal-add" onclick="event.stopPropagation();Forms.seance('${ds}')">+</div>`;
    html+=evs.slice(0,4).map(s=>{const f=form(s.formateurId);const done=s.statut==='Réalisée';return `<div class="ev" style="background:${f.color}1a;color:${f.color};border-left-color:${f.color};${done?'opacity:.65':''}" onclick="event.stopPropagation();Forms.seanceDetail('${s.id}')"><b>${s.debut}</b> ${esc(stagName(s.stagiaireId).split(' ')[0])}<div class="evt">${esc(f.nom.split(' ')[0])} · ${s.modalite}</div></div>`;}).join('');
    if(evs.length>4)html+=`<div style="font-size:10px;color:var(--muted);font-weight:600;padding-left:4px">+${evs.length-4} autre(s)</div>`;
    html+=`</div>`;
  }
  const cells=start+daysInMonth;const trail=(7-cells%7)%7;
  for(let i=1;i<=trail;i++){html+=`<div class="cal-cell out"><div class="cal-date">${i}</div></div>`;}
  html+=`</div>`;
  // legend
  html+=`<div class="legend">${d.formateurs.map(f=>`<span><i style="background:${f.color}"></i>${esc(f.nom)} · ${esc(f.langue)}</span>`).join('')}</div>`;
  return html;
};
App._calMove=function(n){calRef.setMonth(calRef.getMonth()+n);App.go('calendar');};
App._calToday=function(){calRef=new Date();calRef.setDate(1);App.go('calendar');};
App._calFilter=function(v){calFilterF=v;App.go('calendar');};
App._stagFilter=function(v){stagFilter=v;App.go('stagiaires');};

/* ---- REPORTING QUALIOPI ---- */
Views.reporting=function(){
  const d=DB.data;
  const actifs=d.stagiaires.filter(s=>s.statut!=='Terminé').length;
  const termines=d.stagiaires.filter(s=>s.statut==='Terminé').length;
  const totH=d.stagiaires.reduce((a,s)=>a+s.volumeHeures,0);
  const realH=d.stagiaires.reduce((a,s)=>a+s.heuresRealisees,0);
  const seancesReal=d.seances.filter(s=>s.statut==='Réalisée');
  const signed=seancesReal.filter(s=>s.emargement&&s.emargement.stagiaire).length;
  const assiduite=seancesReal.length?Math.round(signed/seancesReal.length*100):100;
  const parLangue={};d.stagiaires.forEach(s=>{parLangue[s.langue]=(parLangue[s.langue]||0)+1;});

  const kpi=(c,l,v,s)=>`<div class="kpi"><div class="lbl">${l}</div><div class="val" style="color:${c}">${v}</div><div class="sub">${s}</div></div>`;
  let html=`<div class="section-row"><div><h2>Reporting & conformité QUALIOPI</h2><p>Indicateurs d'activité et génération des documents d'audit</p></div></div>`;
  html+=`<div class="kpis">
    ${kpi('#4f46e5','Stagiaires actifs',actifs,termines+' terminés')}
    ${kpi('#0284c7','Heures réalisées',realH+' / '+totH+'h',Math.round(realH/totH*100)+'% du volume')}
    ${kpi('#16a34a','Taux d\'assiduité',assiduite+'%','preuves horodatées')}
    ${kpi('#f59e0b','Taux de complétion',Math.round(termines/d.stagiaires.length*100)+'%','formations clôturées')}
  </div>`;

  html+=`<div class="two-col">
    <div class="card"><div class="card-h"><h3>Répartition par langue</h3></div><div class="card-b">
    ${Object.entries(parLangue).map(([l,n])=>{const pct=Math.round(n/d.stagiaires.length*100);return `<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px"><span>${l}</span><span>${n} stagiaire(s)</span></div><div class="progress"><i style="width:${pct}%"></i></div></div>`;}).join('')}
    </div></div>
    <div class="card"><div class="card-h"><h3>Documents d'audit</h3></div><div class="card-b">
      <p class="t-sub" style="margin-bottom:14px">Génération des pièces attendues en audit QUALIOPI.</p>
      ${[['Feuilles d\'émargement','emargement'],['Attestations de réalisation','attestation'],['Synthèse d\'assiduité','assiduite'],['Registre des stagiaires','registre']].map(([t,k])=>`<button class="btn" style="width:100%;justify-content:space-between;margin-bottom:9px" onclick="Exports.${k}?Exports.${k}():Exports.generic('${esc(t)}')">${t}${svg(I.doc)}</button>`).join('')}
    </div></div>
  </div>`;

  // table assiduité par stagiaire
  html+=`<div class="card" style="margin-top:20px"><div class="card-h"><h3>Assiduité par stagiaire</h3><button class="btn btn-sm" onclick="Exports.assiduite()">Exporter</button></div>
  <table><thead><tr><th>Stagiaire</th><th>Entreprise</th><th>Formation</th><th>Heures</th><th>Séances émargées</th><th>Assiduité</th><th>Statut</th></tr></thead><tbody>`;
  html+=d.stagiaires.map(s=>{
    const ss=d.seances.filter(x=>x.stagiaireId===s.id&&x.statut==='Réalisée');
    const sg=ss.filter(x=>x.emargement&&x.emargement.stagiaire).length;
    const a=ss.length?Math.round(sg/ss.length*100):100;
    return `<tr><td class="t-name">${esc(s.prenom+' '+s.nom)}</td><td>${esc(s.entreprise)}</td><td><span class="pill pill-indigo">${esc(s.langue)}</span></td><td>${s.heuresRealisees}/${s.volumeHeures}h</td><td>${sg}/${ss.length}</td><td><b style="color:${a>=90?'var(--green)':a>=70?'var(--accent)':'var(--red)'}">${a}%</b></td><td>${statutPill(s.statut)}</td></tr>`;
  }).join('');
  html+=`</tbody></table></div>`;
  return html;
};

Forms._seAutoForm=function(){

};
Forms.saveSeance=function(){
  const sid=val('seStag'),fid=val('seForm'),date=val('seDate'),deb=val('seDebut'),fin=val('seFin');
  if(!sid||!fid||!date){toast('Champs requis manquants');return;}
  // conflict check
  const conflict=DB.data.seances.find(s=>s.formateurId===fid&&s.date===date&&!(fin<=s.debut||deb>=s.fin));
  if(conflict){if(!confirm('⚠ Conflit d\'horaire détecté pour ce formateur ('+conflict.debut+'–'+conflict.fin+'). Planifier quand même ?'))return;}
  DB.data.seances.push({id:uid('se'),stagiaireId:sid,formateurId:fid,date,debut:deb,fin,modalite:val('seMod'),statut:'Planifiée',emargement:null,suivi:null});

};

/* ---- ÉMARGEMENT (signature pad) ---- */
Forms.emarge=function(id){
  const s=DB.data.seances.find(x=>x.id===id);const f=form(s.formateurId);
  modal(`<div class="modal"><div class="modal-h"><div><h3>Émargement électronique</h3><p>${stagName(s.stagiaireId)} · ${frDate(s.date)} · ${s.debut}–${s.fin}</p></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Signature du stagiaire — ${esc(stagName(s.stagiaireId))}</label><canvas class="sigpad" id="sig1" height="120"></canvas><button class="btn btn-sm btn-ghost" style="margin-top:6px" onclick="Sig.clear('sig1')">Effacer</button></div>
    <div class="field"><label>Signature du formateur — ${esc(f.nom)}</label><canvas class="sigpad" id="sig2" height="120"></canvas><button class="btn btn-sm btn-ghost" style="margin-top:6px" onclick="Sig.clear('sig2')">Effacer</button></div>
    <p class="t-sub" style="margin-top:4px">${svg(I.clock)} Horodatage automatique à la validation — archivage conforme QUALIOPI.</p>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="Forms.saveEmarge('${id}')">Valider l'émargement</button></div></div>`);
  setTimeout(()=>{Sig.init('sig1');Sig.init('sig2');},30);
};
Forms.saveEmarge=function(id){
  if(!Sig.has('sig1')||!Sig.has('sig2')){toast('Les deux signatures sont requises');return;}
  const s=DB.data.seances.find(x=>x.id===id);
  s.emargement={stagiaire:Sig.get('sig1'),formateur:Sig.get('sig2'),ts:new Date().toISOString()};
  s.statut='Réalisée';
  const st=stag(s.stagiaireId);
  if(st){const dur=2;st.heuresRealisees=Math.min(st.volumeHeures,st.heuresRealisees+1.5);if(st.statut==='À démarrer')st.statut='En cours';if(st.heuresRealisees>=st.volumeHeures)st.statut='Terminé';}
  DB.save();closeModal();toast('Émargement validé et horodaté');App.go(App.page);
};
Forms.emargeView=function(id){
  const s=DB.data.seances.find(x=>x.id===id);const f=form(s.formateurId);
  const ts=s.emargement&&s.emargement.ts?new Date(s.emargement.ts).toLocaleString('fr-FR'):'—';
  modal(`<div class="modal"><div class="modal-h"><div><h3>Feuille d'émargement</h3><p>${stagName(s.stagiaireId)} · ${frDate(s.date)}</p></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <table><tbody>
    <tr><th style="width:40%">Stagiaire</th><td>${esc(stagName(s.stagiaireId))}</td></tr>
    <tr><th>Formateur</th><td>${esc(f.nom)}</td></tr>
    <tr><th>Créneau</th><td>${s.debut} – ${s.fin} (${s.modalite})</td></tr>
    <tr><th>Horodatage</th><td>${ts}</td></tr>
    </tbody></table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
      <div><div class="t-sub">Signature stagiaire</div>${sigImg(s.emargement&&s.emargement.stagiaire)}</div>
      <div><div class="t-sub">Signature formateur</div>${sigImg(s.emargement&&s.emargement.formateur)}</div>
    </div>

function sigImg(data){if(data&&data.startsWith&&data.startsWith('data:'))return `<img src="${data}" style="border:1px solid var(--border);border-radius:8px;width:100%;height:90px;object-fit:contain;background:#fff;margin-top:5px">`;return `<div class="sig-done" style="margin-top:5px;height:90px;justify-content:center">${svg(I.check)}Signé</div>`;}

Forms.dossierDetail=function(id){
  const x=DB.data.dossiers.find(d=>d.id===id);const s=x.stagiaireId?stag(x.stagiaireId):null;const st=STEPS.find(z=>z.n===x.etape);
  modal(`<div class="modal"><div class="modal-h"><div><h3>${esc(x.client)}</h3><p>${s?esc(s.prenom+' '+s.nom+' · '+s.langue):'Prospect'} · créé le ${frDate(x.date)}</p></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Étape actuelle</label>
      <div style="display:flex;flex-direction:column;gap:6px">
      ${STEPS.map(z=>`<div onclick="Forms._setEtape('${id}',${z.n})" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid ${z.n===x.etape?'var(--primary)':'var(--border)'};background:${z.n===x.etape?'var(--primary-soft)':'var(--surface)'}">
        <span style="width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:${z.n<x.etape?'var(--green)':z.n===x.etape?'var(--primary)':'var(--border)'};color:${z.n<=x.etape?'#fff':'var(--muted)'}">${z.n<x.etape?'✓':z.n}</span>
        <div><div style="font-weight:700;font-size:12.5px">${z.t}</div><div class="t-sub">${z.c}</div></div></div>`).join('')}
      </div>
    </div>
    <div class="field"><label>Montant (€)</label><input class="input" type="number" id="doM2" value="${x.montant}"></div>
    <div class="field"><label>Notes</label><textarea class="input" id="doN2" rows="2">${esc(x.notes||'')}</textarea></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="Forms.delDossier('${id}')" style="color:var(--red)">Supprimer</button><div style="flex:1"></div><button class="btn btn-primary" onclick="Forms.saveDossierEdit('${id}')">Enregistrer</button></div></div>`);
};
Forms._setEtape=function(id,n){const x=DB.data.dossiers.find(d=>d.id===id);x.etape=n;DB.save();Forms.dossierDetail(id);};
Forms.saveDossierEdit=function(id){const x=DB.data.dossiers.find(d=>d.id===id);x.montant=parseInt(val('doM2'))||0;x.notes=val('doN2');DB.save();closeModal();toast('Dossier mis à jour');App.go('process');};
Forms.delDossier=function(id){if(!confirm('Supprimer ce dossier ?'))return;DB.data.dossiers=DB.data.dossiers.filter(d=>d.id!==id);DB.save();closeModal();toast('Dossier supprimé');App.go('process');};

/* ---- SIGNATURE PAD ---- */
const Sig={
  pads:{},
  init(cid){const c=document.getElementById(cid);if(!c)return;c.width=c.offsetWidth;const ctx=c.getContext('2d');ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#1e1b4b';
    let drawing=false,used=false;
    const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
    const down=e=>{drawing=true;used=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
    const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
    const up=()=>{drawing=false;};
    c.onmousedown=down;c.onmousemove=move;window.addEventListener('mouseup',up);
    c.ontouchstart=down;c.ontouchmove=move;c.ontouchend=up;
    this.pads[cid]={c,get used(){return used;},reset(){used=false;}};
  },
  clear(cid){const p=this.pads[cid];if(!p)return;const ctx=p.c.getContext('2d');ctx.clearRect(0,0,p.c.width,p.c.height);p.reset();},
  has(cid){const p=this.pads[cid];return p&&p.used;},
  get(cid){const p=this.pads[cid];return p?p.c.toDataURL('image/png'):null;}
};

/* ---- EXPORTS ---- */
const Exports={
  download(name,content,type){const blob=new Blob([content],{type:type||'text/csv;charset=utf-8;'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast('Export généré : '+name);},
  csv(rows){return rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');},
  emargement(){
    const rows=[['Date','Début','Fin','Stagiaire','Entreprise','Formateur','Modalité','Émargé','Horodatage']];
    DB.data.seances.filter(s=>s.statut==='Réalisée').sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const st=stag(s.stagiaireId),f=form(s.formateurId);rows.push([s.date,s.debut,s.fin,stagName(s.stagiaireId),st?st.entreprise:'',f.nom,s.modalite,s.emargement&&s.emargement.stagiaire?'Oui':'Non',s.emargement?new Date(s.emargement.ts).toLocaleString('fr-FR'):'']);});
    this.download('emargement_aslearning.csv',this.csv(rows));
  },
  assiduite(){
    const rows=[['Stagiaire','Entreprise','Langue','Heures réalisées','Volume','Séances émargées','Assiduité %','Statut']];
    DB.data.stagiaires.forEach(s=>{const ss=DB.data.seances.filter(x=>x.stagiaireId===s.id&&x.statut==='Réalisée');const sg=ss.filter(x=>x.emargement&&x.emargement.stagiaire).length;const a=ss.length?Math.round(sg/ss.length*100):100;rows.push([s.prenom+' '+s.nom,s.entreprise,s.langue,s.heuresRealisees,s.volumeHeures,sg+'/'+ss.length,a,s.statut]);});
    this.download('assiduite_aslearning.csv',this.csv(rows));
  },
  registre(){
    const rows=[['Prénom','Nom','Entreprise','Langue','Niveau initial','Niveau visé','Profil','Formateur','Volume h','Financement','Statut']];
    DB.data.stagiaires.forEach(s=>{const f=form(s.formateurId);rows.push([s.prenom,s.nom,s.entreprise,s.langue,s.niveauInitial,s.niveauVise,s.profil,f?f.nom:'',s.volumeHeures,s.financement,s.statut]);});
    this.download('registre_stagiaires.csv',this.csv(rows));
  },
  attestation(){
    const termines=DB.data.stagiaires.filter(s=>s.statut==='Terminé');
    if(!termines.length){toast('Aucune formation clôturée');return;}
    const rows=[['Stagiaire','Entreprise','Formation','Heures réalisées','Attestation']];
    termines.forEach(s=>rows.push([s.prenom+' '+s.nom,s.entreprise,s.langue+' '+s.profil,s.heuresRealisees+'h','Certificat de réalisation']));
    this.download('attestations_realisation.csv',this.csv(rows));
  },
  generic(t){toast(t+' — généré (démo)');}
};

App.start();
